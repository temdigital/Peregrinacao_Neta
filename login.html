<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Login – Peregrinação com a Neta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #15acf4;
      --dark: #202718;
      --gold: #9b8556;
      --light: #d0c9bb;
      --white: #ffffff;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)),
                  url('https://cdn.pixabay.com/photo/2015/07/14/08/49/vatican-843901_1280.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: var(--shadow);
      color: white;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-container h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-container h1 span { color: var(--gold); }
    .login-container .sub {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .login-container .form-group {
      margin-bottom: 18px;
    }
    .login-container label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      opacity: 0.9;
    }
    .login-container input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .login-container input:focus {
      border-color: var(--gold);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(155,133,86,0.2);
    }
    .login-container input::placeholder { color: rgba(255,255,255,0.4); }
    .login-container .btn-login {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(155,133,86,0.3);
      margin-top: 6px;
    }
    .login-container .btn-login:hover {
      background: #b89a63;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(155,133,86,0.5);
    }
    .login-container .links {
      display: flex;
      justify-content: flex-end;
      margin: 16px 0 10px;
      font-size: 0.85rem;
    }
    .login-container .links a {
      color: rgba(255,255,255,0.7);
      transition: 0.3s;
      cursor: pointer;
      text-decoration: none;
    }
    .login-container .links a:hover { color: white; }
    .login-container .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      min-height: 24px;
      margin-top: 4px;
    }
    .login-container .success-msg {
      color: #69db7c;
      font-size: 0.85rem;
      min-height: 24px;
      margin-top: 4px;
    }
    .login-container .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      text-decoration: none;
      transition: 0.3s;
    }
    .login-container .back-link:hover { color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="login-container" id="app">
    <h1>Peregrinação<span> com a Neta</span></h1>
    <p class="sub" id="formTitle">Acesse sua conta</p>

    <!-- ===== FORMULÁRIO DE LOGIN ===== -->
    <div id="loginForm">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <div id="loginError" class="error-msg"></div>
      <button class="btn-login" id="loginBtn">Entrar</button>
      <div class="links">
        <a id="showRecoverLink">Esqueci a senha</a>
      </div>
    </div>

    <!-- ===== FORMULÁRIO DE RECUPERAÇÃO ===== -->
    <div id="recoverForm" class="hidden">
      <div class="form-group">
        <label>E-mail cadastrado</label>
        <input type="email" id="recoverEmail" placeholder="seu@email.com" />
      </div>
      <div id="recoverError" class="error-msg"></div>
      <div id="recoverSuccess" class="success-msg hidden">✅ Link de recuperação enviado para seu e-mail.</div>
      <button class="btn-login" id="recoverBtn">Enviar link</button>
      <div class="links">
        <a id="backToLoginFromRecover">← Voltar para o login</a>
      </div>
    </div>

    <a href="index.html" class="back-link">← Voltar para o site</a>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const recoverForm = document.getElementById('recoverForm');
    const formTitle = document.getElementById('formTitle');
    const loginBtn = document.getElementById('loginBtn');
    const recoverBtn = document.getElementById('recoverBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const recoverEmail = document.getElementById('recoverEmail');
    const recoverError = document.getElementById('recoverError');
    const recoverSuccess = document.getElementById('recoverSuccess');

    function showLogin() {
      loginForm.classList.remove('hidden');
      recoverForm.classList.add('hidden');
      formTitle.textContent = 'Acesse sua conta';
      loginError.textContent = '';
      recoverError.textContent = '';
      recoverSuccess.classList.add('hidden');
    }
    function showRecover() {
      loginForm.classList.add('hidden');
      recoverForm.classList.remove('hidden');
      formTitle.textContent = 'Recuperar senha';
      loginError.textContent = '';
      recoverError.textContent = '';
      recoverSuccess.classList.add('hidden');
    }

    document.getElementById('showRecoverLink').addEventListener('click', showRecover);
    document.getElementById('backToLoginFromRecover').addEventListener('click', showLogin);

    // ===== LOGIN =====
    loginBtn.addEventListener('click', function() {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        loginError.textContent = 'Preencha todos os campos.';
        return;
      }
      // Simulação de login (substituir por chamada real ao Supabase)
      if (email === 'admin@teste.com' && password === '123456') {
        window.location.href = 'dashboard.html';
      } else {
        loginError.textContent = 'E-mail ou senha incorretos.';
      }
    });

    // ===== RECUPERAÇÃO =====
    recoverBtn.addEventListener('click', function() {
      const email = recoverEmail.value.trim();
      if (!email) {
        recoverError.textContent = 'Digite seu e-mail.';
        recoverSuccess.classList.add('hidden');
        return;
      }
      recoverError.textContent = '';
      recoverSuccess.classList.remove('hidden');
      setTimeout(() => {
        showLogin();
      }, 3000);
    });

    // ===== ENTER KEY =====
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          if (!loginForm.classList.contains('hidden')) loginBtn.click();
          else if (!recoverForm.classList.contains('hidden')) recoverBtn.click();
        }
      });
    });
  </script>
</body>
</html>
